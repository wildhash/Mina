# Mina Configuration File
# Customize agent behavior and settings

[agent]
# Minimum price threshold for high-end purchases
min_price = 500

# Maximum number of products to analyze per search
max_products = 5

# Enable verbose output for debugging
verbose = false

[retailers]
# List of retailers to search (comma-separated)
# Note: Browser automation integration required for live searching
enabled_retailers = Amazon, Best Buy, B&H Photo, Newegg, Wayfair, Apple Store, Dell, Lenovo, Herman Miller, Steelcase, Miele, LG, Bosch

[confidence_scoring]
# Weights for confidence score calculation (must sum to 1.0)
rating_weight = 0.25
fit_score_weight = 0.40
review_confidence_weight = 0.20
data_completeness_weight = 0.15

# Minimum confidence score to recommend a product
min_confidence_threshold = 60.0

[analysis]
# Number of top recommendations to present
num_recommendations = 3

# Include price history analysis (requires API integration)
include_price_history = false

# Include environmental/sustainability ratings
include_sustainability = false

[output]
# Output format: cli, json, html
format = cli

# Color output in CLI
use_colors = true

# Save recommendations to file
save_to_file = false
output_directory = ./recommendations
